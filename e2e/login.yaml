# Deprecated path — prefer: maestro test tests/e2e/maestro/login.yaml
# Kept for older docs that still reference e2e/login.yaml.
appId: com.tngble.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 10000
- tapOn:
    id: onboarding-login
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 5000
- assertVisible:
    id: login-screen
- assertVisible:
    id: login-email
- assertVisible:
    id: login-submit
- assertVisible:
    id: login-apple
- assertVisible:
    id: login-google
- tapOn:
    id: login-email
- inputText: "e2e+auth@tngble.app"
- tapOn:
    id: login-submit
